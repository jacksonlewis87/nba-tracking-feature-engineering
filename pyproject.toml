[tool.poetry]
name = "nba-tracking-feature-engineering"
version = "0.1.0"
description = "Repository housing data pre-processing and feature enginering for NBA SportVU tracking data"
authors = ["Jackson Lewis"]
readme = "README.md"
packages = [{include = "nba_tracking_feature_engineering"}]

[tool.pytest.ini_options]
pythonpath = ["nba_tracking_feature_engineering"]
testspath = ["tests"]
addopts = "-p no:cacheprovider"

[tool.poetry.dependencies]
python = "^3.10"
nba-tracking-data-commons = { git = "https://github.com/jacksonlewis87/nba-tracking-data-commons.git", tag = "v0.1.3" }

matplotlib = "^3.9.0"
[tool.poetry.group.dev.dependencies]
pytest = "~7.3.0"
pre-commit = "^3.7.1"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
